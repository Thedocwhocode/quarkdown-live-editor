<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Quarkdown Blog{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: -0.5px; }
    .qd-content { font-size: 1.05rem; line-height: 1.75; }
    .qd-content h1,
    .qd-content h2,
    .qd-content h3 { margin-top: 1.8rem; }
    .qd-content pre { background: #1e1e1e; color: #d4d4d4; border-radius: 6px; padding: 1rem; }
    .qd-content code { background: #f0f0f0; padding: 1px 5px; border-radius: 3px; }
    .badge-kind { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; }
    footer { border-top: 1px solid #dee2e6; margin-top: 4rem; padding: 2rem 0; color: #6c757d; font-size: .875rem; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'editorial:post_list' %}">Quarkdown Blog</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'editorial:post_list' %}">Posts</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin/">Admin</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container pb-5">
    {% if messages %}
      {% for msg in messages %}
        <div class="alert alert-{{ msg.tags }} alert-dismissible fade show" role="alert">
          {{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="container text-center">
      Powered by <strong>Quarkdown Blog Engine</strong> &middot;
      Built with <a href="https://github.com/iamgio/quarkdown" class="text-secondary">Quarkdown</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
