name: Blog CI

on:
  push:
    branches: ["main", "claude/quarkdown-blog-engine"]
    paths:
      - "blog/**"
      - ".github/workflows/blog-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "blog/**"

jobs:
  test:
    name: Type-check and unit tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_blog
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: blog/requirements-dev.txt

      - name: Install dependencies
        working-directory: blog
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: blog
        env:
          DJANGO_SETTINGS_MODULE: quarkdown_blog.settings.development
          DATABASE_URL: postgres://blog:blog@localhost:5432/test_blog
          SECRET_KEY: ci-test-secret-key
        run: pytest --tb=short -q
