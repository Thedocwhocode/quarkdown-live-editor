name: Quark CI

on:
  push:
    branches: ["main", "claude/quark-notes"]
    paths:
      - "quark/**"
      - ".github/workflows/quark-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "quark/**"

jobs:
  frontend:
    name: Type-check and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: quark/package-lock.json

      - name: Install dependencies
        working-directory: quark
        run: npm ci

      - name: TypeScript type check
        working-directory: quark
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: quark
        run: npm test
